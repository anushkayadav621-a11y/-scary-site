<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Totally Normal Link 👀</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
    }

    #startBtn {
      padding: 20px 40px;
      font-size: 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: crimson;
      color: white;
      transition: 0.2s;
    }

    #startBtn:hover {
      transform: scale(1.05);
    }

    #scaryImage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 999;
    }

    .shake {
      animation: shake 0.08s infinite;
    }

    @keyframes shake {
      0% { transform: translate(5px, 5px) rotate(0deg); }
      25% { transform: translate(-5px, 5px) rotate(-1deg); }
      50% { transform: translate(5px, -5px) rotate(1deg); }
      75% { transform: translate(-5px, -5px) rotate(0deg); }
      100% { transform: translate(5px, 5px) rotate(-1deg); }
    }
  </style>
</head>
<body>

  <button id="startBtn">Click Me 😈</button>

  <!-- Replace with your scary image -->
  <img id="scaryImage" src="https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=1200&auto=format&fit=crop" alt="Scary" />

  <!-- Replace with your scream sound -->
  <audio id="scream" src="https://www.soundjay.com/human/sounds/scream-01.mp3"></audio>

  <script>
    const btn = document.getElementById('startBtn');
    const scaryImage = document.getElementById('scaryImage');
    const scream = document.getElementById('scream');

    btn.addEventListener('click', () => {
      scaryImage.style.display = 'block';
      document.body.classList.add('shake');

      scream.volume = 1;
      scream.play();

      // Flash background rapidly
      let flash = false;
      const flashInterval = setInterval(() => {
        document.body.style.background = flash ? 'black' : 'darkred';
        flash = !flash;
      }, 60);

      // Stop after 6 seconds
      setTimeout(() => {
        clearInterval(flashInterval);
        document.body.classList.remove('shake');
      }, 6000);
    });
  </script>

</body>
</html>
